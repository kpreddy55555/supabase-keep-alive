name: Keep Supabase Alive
on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 */5 * *'
permissions:
  contents: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Ping all projects
        env:
          URL_1: ${{ secrets.SUPABASE_URL_1 }}
          KEY_1: ${{ secrets.SUPABASE_KEY_1 }}
          URL_2: ${{ secrets.SUPABASE_URL_2 }}
          KEY_2: ${{ secrets.SUPABASE_KEY_2 }}
          URL_3: ${{ secrets.SUPABASE_URL_3 }}
          KEY_3: ${{ secrets.SUPABASE_KEY_3 }}
          URL_4: ${{ secrets.SUPABASE_URL_4 }}
          KEY_4: ${{ secrets.SUPABASE_KEY_4 }}
          URL_5: ${{ secrets.SUPABASE_URL_5 }}
          KEY_5: ${{ secrets.SUPABASE_KEY_5 }}
          URL_6: ${{ secrets.SUPABASE_URL_6 }}
          KEY_6: ${{ secrets.SUPABASE_KEY_6 }}
        run: |
          fail=0
          for i in 1 2 3 4 5 6; do
            u="URL_$i"; k="KEY_$i"
            code=$(curl -s -o /dev/null -w "%{http_code}" \
              "${!u}/rest/v1/keepalive?select=id&limit=1" \
              -H "apikey: ${!k}")
            echo "Project $i: HTTP $code"
            if [ "$code" != "200" ]; then fail=1; fi
          done
          exit $fail

      - name: Keep repo active
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          date > last_run.txt
          git add last_run.txt
          git commit -m "Keep-alive ping $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "No changes to commit"
          git push
